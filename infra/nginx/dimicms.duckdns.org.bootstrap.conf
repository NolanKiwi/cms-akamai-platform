# Bootstrap config — HTTP only, just enough to serve ACME http-01 challenges.
# Replaced by dimicms.duckdns.org.conf once the cert exists.

server {
    listen 80;
    listen [::]:80;
    server_name dimicms.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'dimi-cms bootstrap — issuing certificate, please wait\n';
        add_header Content-Type text/plain;
    }
}
