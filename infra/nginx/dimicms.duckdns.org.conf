# dimi-cms — public host nginx config
# Path layout:
#   /            → cms-admin (Next.js, port 17001)
#   /api/*       → cms-api  (NestJS, port 17000) — global prefix is /api/v1
#   /web/*       → web-frontend (Next.js, port 17002)
#   /minio/*     → MinIO console (optional, dev only)
#
# Install instructions: see scripts/setup-public-host.sh

server {
    listen 80;
    listen [::]:80;
    server_name dimicms.duckdns.org;

    # ACME http-01 challenge (certbot --webroot or standalone needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dimicms.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/dimicms.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dimicms.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_dimicms:10m;
    ssl_session_timeout 1d;

    # Reasonable limits — adjust if uploading large videos via /api
    client_max_body_size 200m;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 10s;
    proxy_buffering off;

    # Gzip — Next.js already serves precompressed; nginx handles dynamic
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── cms-api (NestJS) ────────────────────────────────────────────
    # Keeps the /api/v1 prefix intact: client calls /api/v1/auth/login
    # → upstream sees /api/v1/auth/login
    location /api/ {
        proxy_pass         http://127.0.0.1:17000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
    }

    # ── web-frontend (Next.js public site) ──────────────────────────
    # Note: serving Next under a subpath only works if you also set
    # `basePath: '/web'` in apps/web-frontend/next.config.js.
    # Until that is done, prefer a separate subdomain (web.dimicms…).
    location /web/ {
        proxy_pass         http://127.0.0.1:17002/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── cms-admin (Next.js — root) ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:17001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
