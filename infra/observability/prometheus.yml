global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cms-api
    static_configs:
      - targets: ['host.docker.internal:9091']

  - job_name: postgres
    static_configs:
      - targets: ['host.docker.internal:9187']

  - job_name: redis
    static_configs:
      - targets: ['host.docker.internal:9121']
