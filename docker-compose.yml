version: "3.9"

# ─────────────────────────────────────────────────────────────
# CMS Akamai Platform — Local Development Stack
# 포트 전략: 17xxx 대역 (타 서비스 충돌 회피)
#   CMS API:              17000
#   CMS Admin:            17001
#   Web Frontend:         17002
#   PostgreSQL:           17432
#   Redis:                17379
#   OpenSearch:           17200
#   OpenSearch Dashboards:17601
#   MinIO API:            17900
#   MinIO Console:        17901
#   Prometheus:           17090
#   Grafana:              17300
#   Mailhog SMTP:         17025
#   Mailhog Web:          17825
#   Jaeger (traces):      17686
# ─────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_dev_password}
    ports:
      - "17432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_admin -d cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-cms_dev_redis}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "17379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cms_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OpenSearch ─────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: cms-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-CmsD3v@dm1n!}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - plugins.security.ssl.http.enabled=false
    ports:
      - "17200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── OpenSearch Dashboards ──────────────────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: cms-opensearch-dashboards
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "17601:5601"

  # ── MinIO (S3-compatible) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: cms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cms_dev_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cms_dev_secret_key_123}
    ports:
      - "17900:9000"
      - "17901:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MinIO bucket 초기화 ────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: cms-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-cms_dev_access} ${MINIO_SECRET_KEY:-cms_dev_secret_key_123};
        mc mb --ignore-existing local/cms-media-dev;
        mc mb --ignore-existing local/cms-video-source-dev;
        mc mb --ignore-existing local/cms-video-processed-dev;
        mc mb --ignore-existing local/cms-logs-dev;
        mc anonymous set download local/cms-media-dev;
        echo 'MinIO 버킷 준비 완료';
      "
    restart: "no"

  # ── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: cms-prometheus
    restart: unless-stopped
    ports:
      - "17090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: cms-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cms_dev_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3000"
    ports:
      - "17300:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro

  # ── Jaeger (분산 추적) ────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cms-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "17686:16686"   # Jaeger UI
      - "17317:4317"    # OTLP gRPC
      - "17318:4318"    # OTLP HTTP

  # ── Mailhog (로컬 이메일 테스트) ──────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: cms-mailhog
    restart: unless-stopped
    ports:
      - "17025:1025"    # SMTP
      - "17825:8025"    # Web UI

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: cms-network
